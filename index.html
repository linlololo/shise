    cards.className = 'day-cards';
    records.forEach((record, index) => cards.append(createRecordCard(record, index)));
    inner.append(cards);
    detail.append(inner);

    summary.addEventListener('click', () => {
      const open = !state.expandedDays.has(dateKey);
      if (open) state.expandedDays.add(dateKey);
      else state.expandedDays.delete(dateKey);
      section.classList.toggle('is-open', open);
      summary.setAttribute('aria-expanded', String(open));
      detail.toggleAttribute('inert', !open);
      detail.setAttribute('aria-hidden', String(!open));
      summary.setAttribute('aria-label', `${date.getMonth() + 1}月${date.getDate()}日，${groupWeekText(date)}，${records.length} 次记录，${spokenColors} 种颜色，${open ? '收起' : '展开'}当天的记录`);
    });

    section.append(summary, detail);
    return section;
  }

  function renderTimeline() {
    const timeline = ui.timeline;
    timeline.innerHTML = '';
    if (!state.records.length) {
      timeline.append(makeEmptyState());
      return;
    }
    const fragment = document.createDocumentFragment();
    groupRecords().forEach(([dateKey, records], index) => {
      fragment.append(createDayGroup(dateKey, records, index));
    });
    timeline.append(fragment);
  }

  function renderHome() {
    renderHero();
    renderTimeline();
  }

  /* ---------------- 录音播放器 ---------------- */

  function stopActiveAudio() {
    if (state.activeAudio) {
      state.activeAudio.destroy();
      state.activeAudio = null;
    }
  }

  function setupAudioPlayer(root, sources, durationHint = 0) {
    if (!root) return null;
    const tracks = (Array.isArray(sources) ? sources : [{ src: sources, durationMs: durationHint }])
      .filter((track) => track && track.src)
      .map((track) => ({
        src: track.src,
        durationMs: Math.max(0, Number(track.durationMs) || 0)
      }));
    if (!tracks.length) return null;

    const playButton = $('[data-play]', root);
    const fill = $('[data-progress]', root);
    const time = $('[data-time]', root);
    if (!playButton || !fill || !time) return null;

    const audio = new Audio();
    audio.preload = 'metadata';
    const durations = tracks.map((track) => track.durationMs / 1000);
    const defaultLabel = tracks.length > 1 ? '播放全部录音' : '播放录音';
    let currentIndex = 0;
    let finished = false;
    let destroyed = false;

    const setLabel = (playing) => {
      playButton.setAttribute('aria-label', playing ? '暂停录音' : defaultLabel);
    };
    const sync = () => {
      if (destroyed) return;
      const currentDuration = Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.duration
        : durations[currentIndex] || 0;
      const total = durations.reduce((sum, duration, index) => sum + (index === currentIndex ? currentDuration : duration), 0);
      const before = durations.slice(0, currentIndex).reduce((sum, duration) => sum + duration, 0);
      const current = before + Math.min(audio.currentTime || 0, currentDuration || 0);
      time.textContent = `${durationText(current * 1000)} / ${durationText(total * 1000)}`;
      fill.style.transform = `scaleX(${total ? clamp(current / total, 0, 1) : 0})`;
    };
    const loadTrack = (index, autoplay) => {
      currentIndex = index;
      finished = false;
      audio.src = tracks[index].src;
      sync();
      if (autoplay) {
        const promise = audio.play();
        if (promise && typeof promise.catch === 'function') {
          promise.catch(() => showToast('这段声音暂时无法播放'));
        }
      }
    };

    audio.addEventListener('loadedmetadata', () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) durations[currentIndex] = audio.duration;
      sync();
    });
    audio.addEventListener('durationchange', sync);
    audio.addEventListener('timeupdate', sync);
    audio.addEventListener('play', () => {
      if (state.activeAudio && state.activeAudio !== controller) stopActiveAudio();
      state.activeAudio = controller;
      root.classList.add('is-playing');
      setLabel(true);
    });
    audio.addEventListener('pause', () => {
      root.classList.remove('is-playing');
      setLabel(false);
    });
    audio.addEventListener('ended', () => {
      if (currentIndex < tracks.length - 1) {
        loadTrack(currentIndex + 1, true);
        return;
      }
      finished = true;
      root.classList.remove('is-playing');
      setLabel(false);
      currentIndex = 0;
      audio.src = tracks[0].src;
      sync();
    });
    audio.addEventListener('error', () => {
      if (!destroyed) showToast('这段声音暂时无法播放');
    });
    playButton.addEventListener('click', async () => {
      if (audio.paused) {
        if (finished) {
          finished = false;
          currentIndex = 0;
          audio.src = tracks[0].src;
        }
        if (state.activeAudio && state.activeAudio !== controller) stopActiveAudio();
        state.activeAudio = controller;
        try {
          await audio.play();
        } catch (error) {
          showToast('这段声音暂时无法播放');
        }
      } else {
        audio.pause();
      }
    });

    const controller = {
      audio,
      destroy() {
        if (destroyed) return;
        destroyed = true;
        try { audio.pause(); } catch (error) { /* noop */ }
        audio.removeAttribute('src');
        try { audio.load(); } catch (error) { /* noop */ }
        root.classList.remove('is-playing');
        if (state.activeAudio === controller) state.activeAudio = null;
      }
    };
    setLabel(false);
    audio.src = tracks[0].src;
    sync();
    return controller;
  }

  function audioPlayerMarkup(label) {
    return `
      <div class="audio-player" data-audio-player>
        <button class="audio-play" type="button" data-play aria-label="播放录音">
          <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.8 18 12l-9 5.2z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" aria-hidden="true"><path d="M9 7v10M15 7v10"/></svg>
        </button>
        <div class="audio-main">
          <div class="audio-top">
            <span class="audio-label">${escapeHtml(label)}</span>
            <span class="audio-time" data-time>0:00</span>
          </div>
          <div class="audio-track"><span class="audio-fill" data-progress></span></div>
        </div>
      </div>
    `;
  }

  function renderDraftAudio() {
    const draft = state.draft;
    if (!draft) return;
    stopActiveAudio();
    const clips = Array.isArray(draft.audioClips) ? draft.audioClips : [];
    if (!clips.length) {
      ui.draftAudio.hidden = true;
      ui.draftAudio.innerHTML = '';
      updateVoiceCopy();
      return;
    }
    ui.draftAudio.hidden = false;
    ui.draftAudio.innerHTML = clips.map((clip, index) => `
      <div class="draft-audio-line">
        ${audioPlayerMarkup(`第 ${index + 1} 段 · ${durationText(clip.durationMs)}`)}
        <button class="audio-remove" type="button" data-remove-audio="${index}" aria-label="移除第 ${index + 1} 段录音" title="移除这段录音">×</button>
      </div>
    `).join('');
    $$('[data-audio-player]', ui.draftAudio).forEach((player, index) => {
      setupAudioPlayer(player, clips[index].url, clips[index].durationMs);
    });
    $$('[data-remove-audio]', ui.draftAudio).forEach((button) => {
      button.addEventListener('click', () => {
        if (!state.draft) return;
        const removeIndex = Number(button.dataset.removeAudio);
        stopActiveAudio();
        const [removed] = state.draft.audioClips.splice(removeIndex, 1);
        if (removed && removed.url) URL.revokeObjectURL(removed.url);
        renderDraftAudio();
        updateSaveState();
        showToast('已移除这段声音');
      });
    });
    updateVoiceCopy();
  }

  function updateVoiceCopy() {
    if (!state.draft || !ui.voiceState) return;
    if (!voice.supported) {
      ui.voiceState.textContent = '暂时不能录音';
      ui.voiceTimer.textContent = '照片与文字仍可保存';
      return;
    }
    if (voice.recording || voice.starting) return;
    const clips = Array.isArray(state.draft.audioClips) ? state.draft.audioClips : [];
    if (clips.length) {
      const total = clips.reduce((sum, clip) => sum + clip.durationMs, 0);
      ui.voiceState.textContent = `已留下 ${clips.length} 段声音`;
      ui.voiceTimer.textContent = `共 ${durationText(total)}`;
      ui.voiceHint.textContent = '按住可以继续加一段，不会覆盖前面的声音。每段最长 5 分钟。';
    } else {
      ui.voiceState.textContent = '按住说话，松手结束';
      ui.voiceTimer.textContent = '最长 5 分钟';
      ui.voiceHint.textContent = '把当时的声音，也留在一起。';
    }
  }

  /* ---------------- 录音 ---------------- */

  function detectVoiceSupport() {
    voice.supported = Boolean(
      navigator.mediaDevices &&
      typeof navigator.mediaDevices.getUserMedia === 'function' &&
      typeof window.MediaRecorder === 'function'
    );
    if (!ui.holdVoice) return;
    if (!voice.supported) {
      ui.holdVoice.disabled = true;
      ui.holdVoice.setAttribute('aria-disabled', 'true');
      ui.voiceUnsupported.hidden = false;
      ui.voiceUnsupported.textContent = window.isSecureContext
        ? '这个浏览器暂时不能录音；照片和文字仍然可以保存。'
        : '录音需要在 HTTPS 或 localhost 页面打开；照片和文字仍然可以保存。';
      ui.voiceState.textContent = '暂时不能录音';
      ui.voiceTimer.textContent = '照片与文字仍可保存';
    } else {
      ui.holdVoice.disabled = false;
      ui.holdVoice.removeAttribute('aria-disabled');
      ui.voiceUnsupported.hidden = true;
    }
  }

  function chooseAudioMime() {
    const candidates = [
      'audio/mp4;codecs=mp4a.40.2',
      'audio/mp4',
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus'
    ];
    for (const type of candidates) {
      try {
        if (MediaRecorder.isTypeSupported(type)) return type;
      } catch (error) {
        // 某些浏览器不支持 isTypeSupported，交给默认设置。
      }
    }
    return '';
  }

  function clearVoiceTimers() {
    if (voice.ticker) {
      clearInterval(voice.ticker);
      voice.ticker = null;
    }
    if (voice.limitTimer) {
      clearTimeout(voice.limitTimer);
      voice.limitTimer = null;
    }
  }

  function updateVoiceTimer() {
    if (!voice.recording) return;
    const elapsed = performance.now() - voice.startedAt;
    ui.voiceTimer.textContent = durationText(elapsed);
  }

  function resetVoiceVisual() {
    if (!ui.holdVoice) return;
    voice.starting = false;
    voice.recording = false;
    voice.holding = false;
    ui.holdVoice.classList.remove('is-recording', 'is-pressing');
    ui.holdLabel.textContent = '按住';
    ui.holdVoice.setAttribute('aria-label', '按住录音，松开结束');
    ui.voiceWave.hidden = true;
    updateVoiceCopy();
    updateSaveState();
  }

  function abandonPendingVoiceStart() {
    if (!voice.starting) return;
    voice.holding = false;
    releaseVoiceStream();
    resetVoiceVisual();
  }

  function releaseVoiceStream() {
    if (voice.stream) {
      voice.stream.getTracks().forEach((track) => {
        try { track.stop(); } catch (error) { /* noop */ }
      });
      voice.stream = null;
    }
  }

  async function beginVoiceRecording() {
    if (!voice.supported || voice.starting || voice.recording || !state.draft) return;
    if (state.route.name !== 'record') return;
    stopActiveAudio();
    const currentClipCount = Array.isArray(state.draft.audioClips) ? state.draft.audioClips.length : 0;
    voice.holding = true;
    voice.starting = true;
    voice.recording = false;
    voice.discard = false;
    voice.chunks = [];
    ui.holdVoice.classList.add('is-pressing');
    ui.holdLabel.textContent = '准备中';
    ui.voiceState.textContent = '正在打开麦克风…';
    ui.voiceTimer.textContent = '0:00';
    ui.voiceWave.hidden = true;
    updateSaveState();

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (!voice.holding || state.route.name !== 'record' || !state.draft) {
        stream.getTracks().forEach((track) => { try { track.stop(); } catch (error) { /* noop */ } });
        resetVoiceVisual();
        return;
      }
      voice.stream = stream;
      const mime = chooseAudioMime();
      let recorder;
      try {
        recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      } catch (error) {
        recorder = new MediaRecorder(stream);
      }
      voice.recorder = recorder;
      voice.mime = recorder.mimeType || mime || 'audio/webm';
      voice.chunks = [];
      voice.starting = false;
      voice.recording = true;
      voice.startedAt = performance.now();

      recorder.addEventListener('dataavailable', (event) => {
        if (event.data && event.data.size) voice.chunks.push(event.data);
      });
      recorder.addEventListener('stop', finishVoiceRecording);
      recorder.addEventListener('error', () => {
        showToast('录音没有成功，再试一次吧');
        stopVoiceRecording({ discard: true });
      });
      recorder.start(250);

      ui.holdVoice.classList.remove('is-pressing');
      ui.holdVoice.classList.add('is-recording');
      ui.holdLabel.textContent = '松开';
      ui.voiceState.textContent = currentClipCount ? `正在听第 ${currentClipCount + 1} 段…` : '正在听…';
      ui.voiceWave.hidden = false;
      ui.voiceTimer.textContent = '0:00';
      updateVoiceTimer();
      updateSaveState();
      voice.ticker = setInterval(updateVoiceTimer, 180);
      voice.limitTimer = setTimeout(() => {
        if (!voice.recording) return;
        showToast('五分钟到了，声音已替你收住');
        stopVoiceRecording();
      }, MAX_AUDIO_MS);
    } catch (error) {
      voice.starting = false;
      voice.holding = false;
      releaseVoiceStream();
      resetVoiceVisual();
      const name = error && error.name;
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        showToast('没有麦克风权限；照片和文字仍可保存');
      } else if (name === 'NotFoundError') {
        showToast('没有找到可用的麦克风');
      } else {
        showToast('暂时无法录音，照片和文字仍可保存');
      }
    }
  }

  function stopVoiceRecording(options = {}) {
    const discard = Boolean(options.discard);
    voice.holding = false;
    voice.starting = false;
    if (discard) voice.discard = true;
    clearVoiceTimers();
    if (voice.recorder && voice.recorder.state !== 'inactive') {
      try {
        voice.recorder.stop();
      } catch (error) {
        releaseVoiceStream();
        resetVoiceVisual();
      }
    } else {
      releaseVoiceStream();
      resetVoiceVisual();
    }
  }

  function finishVoiceRecording() {
    clearVoiceTimers();
    releaseVoiceStream();
    const elapsed = voice.startedAt ? performance.now() - voice.startedAt : 0;
    const chunks = voice.chunks.slice();
    const mime = voice.mime || 'audio/webm';
    const shouldDiscard = voice.discard || state.route.name !== 'record' || !state.draft;
    voice.recorder = null;
    voice.chunks = [];
    voice.recording = false;
    voice.discard = false;
    resetVoiceVisual();

    if (shouldDiscard) return;
    if (!chunks.length) {
      showToast('没有收到声音，再试一次吧');
      return;
    }
    if (elapsed < 550) {
      showToast('再按久一点，声音才留得住');
      return;
    }
    const blob = new Blob(chunks, { type: mime });
    if (!blob.size) {
      showToast('没有收到声音，再试一次吧');
      return;
    }
    const clip = {
      blob,
      durationMs: Math.max(1000, Math.round(elapsed)),
      mime,
      url: URL.createObjectURL(blob)
    };
    state.draft.audioClips.push(clip);
    renderDraftAudio();
    updateSaveState();
    showToast(`已添加第 ${state.draft.audioClips.length} 段声音`);
  }

  function cancelVoiceSession() {
    clearVoiceTimers();
    voice.discard = true;
    voice.holding = false;
    voice.starting = false;
    voice.recording = false;
    if (voice.recorder && voice.recorder.state !== 'inactive') {
      try { voice.recorder.stop(); } catch (error) { releaseVoiceStream(); }
    } else {
      releaseVoiceStream();
    }
    voice.recorder = null;
    voice.chunks = [];
  }

  /* ---------------- 记录页 ---------------- */

  function newDraft() {
    return {
      photoBlob: null,
      previewUrl: null,
      colors: null,
      processing: false,
      audioClips: []
    };
  }

  function updateSaveState() {
    if (!ui.saveBtn) return;
    const draft = state.draft;
    const hasPhoto = Boolean(draft && draft.photoBlob && Array.isArray(draft.colors) && draft.colors.length === 5);
    const working = Boolean(draft && draft.processing);
    const ready = hasPhoto && !working && !voice.recording && !voice.starting && !state.saving;
    ui.saveBtn.disabled = !ready;
    if (state.saving) {
      ui.saveText.textContent = '正在收起';
      ui.saveHint.textContent = '请稍候';
    } else if (voice.recording || voice.starting) {
      ui.saveText.textContent = '收进色谱';
      ui.saveHint.textContent = '录音中';
    } else if (!draft || !draft.photoBlob) {
      ui.saveText.textContent = '收进色谱';
      ui.saveHint.textContent = '还需一张照片';
    } else if (working) {
      ui.saveText.textContent = '收进色谱';
      ui.saveHint.textContent = '正在拾色';
    } else if (!hasPhoto) {
      ui.saveText.textContent = '收进色谱';
      ui.saveHint.textContent = '还没拾到颜色';
    } else {
      ui.saveText.textContent = '收进色谱';
      ui.saveHint.textContent = '五种颜色已就绪';
    }
  }

  function clearPalettePreview() {
    ui.palettePreview.hidden = true;
    ui.paletteStrip.innerHTML = '';
  }

  function renderPalettePreview(colors) {
    ui.paletteStrip.innerHTML = '';
    colors.forEach((hex, index) => {
      const item = document.createElement('div');
      item.className = 'preview-swatch';
      item.style.setProperty('--i', String(index));
      const chip = document.createElement('div');
      chip.className = 'preview-chip';
      chip.style.setProperty('--swatch', hex);
      chip.title = hex;
      const label = document.createElement('span');
      label.className = 'preview-hex';
      label.textContent = hex;
      item.append(chip, label);
      ui.paletteStrip.append(item);
    });
    ui.palettePreview.hidden = false;
  }

  function resetPhotoArea() {
    ui.photoEmpty.hidden = false;
    ui.photoView.hidden = true;
    ui.photoSwap.hidden = true;
    ui.draftPhoto.removeAttribute('src');
    ui.draftPhoto.classList.remove('is-loaded');
    ui.extracting.hidden = true;
    clearPalettePreview();
  }

  function setupRecordPage() {
    state.draft = newDraft();
    state.photoSeq += 1;
    ui.recordForm.reset();
    ui.noteInput.value = '';
    ui.noteCount.textContent = `0 / ${MAX_NOTE}`;
    ui.photoEmpty.hidden = false;
    ui.photoView.hidden = true;
    ui.photoSwap.hidden = true;
    ui.extracting.hidden = true;
    ui.draftPhoto.removeAttribute('src');
    ui.draftPhoto.classList.remove('is-loaded');
    clearPalettePreview();
    ui.draftAudio.hidden = true;
    ui.draftAudio.innerHTML = '';
    ui.voiceWave.hidden = true;
    ui.voiceTimer.textContent = '最长 5 分钟';
    ui.voiceState.textContent = '按住说话，松手结束';
    ui.holdLabel.textContent = '按住';
    ui.holdVoice.classList.remove('is-recording', 'is-pressing');
    ui.voiceHint.textContent = '把当时的声音，也留在一起。';
    if (ui.recordPrivacy) {
      ui.recordPrivacy.textContent = state.storageMode === 'indexeddb'
        ? '照片、颜色与声音只写入本机浏览器的 IndexedDB。'
        : '当前为预览模式：记录只在本次页面内暂存，刷新后会清空。';
    }
    if (state.activeAudio) stopActiveAudio();
    detectVoiceSupport();
    updateSaveState();
    state.saving = false;
  }

  function teardownRecordPage() {
    cancelVoiceSession();
    stopActiveAudio();
    const draft = state.draft;
    if (draft) {
      if (draft.previewUrl) URL.revokeObjectURL(draft.previewUrl);
      if (Array.isArray(draft.audioClips)) {
        draft.audioClips.forEach((clip) => {
          if (clip.url) URL.revokeObjectURL(clip.url);
        });
      }
    }
    state.draft = null;
    state.photoSeq += 1;
    if (ui.draftAudio) {
      ui.draftAudio.innerHTML = '';
      ui.draftAudio.hidden = true;
    }
    if (ui.photoEmpty) {
      ui.photoEmpty.hidden = false;
      ui.photoView.hidden = true;
      ui.photoSwap.hidden = true;
      ui.extracting.hidden = true;
      ui.draftPhoto.removeAttribute('src');
      ui.draftPhoto.classList.remove('is-loaded');
      clearPalettePreview();
    }
    if (ui.holdVoice) {
      ui.holdVoice.classList.remove('is-recording', 'is-pressing');
      ui.holdLabel.textContent = '按住';
    }
  }

  function openPhotoPicker(input) {
    if (!input) return;
    input.value = '';
    try {
      input.click();
    } catch (error) {
      showToast('无法打开相册，请再试一次');
    }
  }

  async function handlePhotoFile(file) {
    if (!file || !state.draft) return;
    const looksLikeImage = (file.type && file.type.startsWith('image/')) ||
      /\.(?:jpe?g|png|webp|gif|heic|heif|bmp|avif)$/i.test(file.name || '');
    if (!looksLikeImage) {
      showToast('请选择一张照片');
      return;
    }
    if (state.route.name !== 'record') return;

    const sequence = ++state.photoSeq;
    const previousUrl = state.draft.previewUrl;
    const rawUrl = URL.createObjectURL(file);
    state.draft.previewUrl = rawUrl;
    state.draft.photoBlob = null;
    state.draft.colors = null;
    state.draft.processing = true;
    state.draft.photoSeq = sequence;

    ui.draftPhoto.src = rawUrl;
    ui.draftPhoto.classList.remove('is-loaded');
    ui.photoEmpty.hidden = true;
    ui.photoView.hidden = false;
    ui.photoSwap.hidden = false;
    ui.extracting.hidden = false;
    clearPalettePreview();
    if (previousUrl) URL.revokeObjectURL(previousUrl);
    updateSaveState();

    try {
      const prepared = await preparePhoto(file);
      if (sequence !== state.photoSeq || state.route.name !== 'record' || !state.draft) {
        URL.revokeObjectURL(prepared.url);
        return;
      }
      const oldPreview = state.draft.previewUrl;
      state.draft.photoBlob = prepared.blob;
      state.draft.colors = prepared.colors;
      state.draft.previewUrl = prepared.url;
      ui.draftPhoto.src = prepared.url;
      ui.draftPhoto.classList.remove('is-loaded');
      ui.extracting.hidden = true;
      renderPalettePreview(prepared.colors);
      state.draft.processing = false;
      if (oldPreview && oldPreview !== prepared.url) URL.revokeObjectURL(oldPreview);
      updateSaveState();
    } catch (error) {
      if (sequence !== state.photoSeq || !state.draft) return;
      state.draft.processing = false;
      if (state.draft.previewUrl) URL.revokeObjectURL(state.draft.previewUrl);
      state.draft.previewUrl = null;
      state.draft.photoBlob = null;
      state.draft.colors = null;
      resetPhotoArea();
      updateSaveState();
      console.error('拾色：照片处理失败', error);
      showToast('这张照片暂时读不出来，换一张试试');
    }
  }

  function renderDurableRecord(record) {
    const date = new Date(record.createdAt);
    const colors = Array.isArray(record.colors) ? record.colors.map(normalizeHex).filter(Boolean) : [];
    const note = typeof record.note === 'string' ? record.note.trim() : '';
    const photoUrl = photoUrlFor(record);
    const clips = recordAudioClips(record);
    const audioSources = clips.map((clip, index) => ({
      src: audioUrlFor(record, index, clip.blob),
      durationMs: clip.durationMs
    }));
    const audioTotal = clips.reduce((sum, clip) => sum + clip.durationMs, 0);
    const colorCells = colors.map((hex) => `
      <div class="color-cell">
        <span class="color-dot" style="--swatch:${escapeHtml(hex)}" title="${escapeHtml(hex)}"></span>
        <span class="color-hex">${escapeHtml(hex)}</span>
      </div>
    `).join('');

    ui.detailContent.innerHTML = `
      <div class="detail-photo-wrap">
        <img class="detail-photo" id="detailPhoto" src="${escapeHtml(photoUrl)}" alt="${note ? escapeHtml(note) : '一张记录了此刻颜色的照片'}">
      </div>
      <p class="detail-date">${escapeHtml(detailDateText(date))}</p>
      <section class="detail-section" aria-labelledby="paletteKicker">
        <div class="detail-kicker" id="paletteKicker"><span>这张照片的颜色</span><span>${colors.length} 种</span></div>
        <div class="palette-grid">${colorCells}</div>
      </section>
      ${note ? `<p class="detail-note">${escapeHtml(note)}</p>` : ''}
      ${clips.length ? `
        <section class="detail-voice" aria-label="${clips.length > 1 ? `${clips.length} 段录音` : '这段记录的声音'}">
          <div class="detail-kicker">
            <span>${clips.length > 1 ? `${clips.length} 段声音` : '一段声音'}</span>
            <span>${escapeHtml(durationText(audioTotal))}</span>
          </div>
          ${audioPlayerMarkup(clips.length > 1 ? '从头连播这几段声音' : '留在这一刻的声音').replace('class="audio-player"', 'class="audio-player audio-player--detail"')}
        </section>
      ` : ''}
      <p class="detail-end">拾于 ${escapeHtml(`${date.getFullYear()}.${pad2(date.getMonth() + 1)}.${pad2(date.getDate())}`)}</p>
    `;

    const image = $('#detailPhoto', ui.detailContent);
    if (image) {
      const show = () => image.classList.add('is-loaded');
      if (image.complete && image.naturalWidth) show();
      else image.addEventListener('load', show, { once: true });
      image.addEventListener('error', () => {
        showToast('照片暂时无法显示');
        show();
      }, { once: true });
    }
    if (audioSources.length) {
      const player = $('[data-audio-player]', ui.detailContent);
      setupAudioPlayer(player, audioSources);
    }
  }

  async function handleSave(event) {
    event.preventDefault();
    if (state.saving) return;
    const draft = state.draft;
    if (!draft || !draft.photoBlob || !draft.colors || draft.colors.length !== 5 || draft.processing) return;
    if (voice.recording || voice.starting) {
      showToast('先松开录音，再收进色谱');
      return;
    }
    const now = new Date();
    const record = {
      id: makeId(),
      createdAt: now.toISOString(),
      dateKey: dateKeyOf(now),
      monthKey: monthKeyOf(now),
      colors: draft.colors.slice(0, 5),
      note: (ui.noteInput.value || '').trim().slice(0, MAX_NOTE),
      photo: draft.photoBlob,
      audioClips: draft.audioClips.map((clip) => ({
        blob: clip.blob,
        durationMs: clip.durationMs,
        mime: clip.mime
      })),
      paletteVersion: 2,
      version: 2
    };

    state.saving = true;
    updateSaveState();
    let persisted = state.storageMode === 'indexeddb';
    if (persisted) {
      try {
        await saveRecord(record);
      } catch (error) {
        // 写入失败也不打断预览：切到内存模式继续保存当前页面的记录。
        persisted = false;
        state.storageMode = 'memory';
        state.db = null;
        console.warn('拾色：写入本地数据库失败，已切换到内存预览模式。', error);
      }
    }
    state.records.unshift(record);
    state.records.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    state.expandedDays.add(record.dateKey);
    state.pendingScrollDay = record.dateKey;
    state.homeScroll = 0;
    state.saving = false;
    updateSaveState();
    if (state.activeAudio) stopActiveAudio();
    replaceRoute('/');
    showToast(persisted ? '已收进色谱' : '已记下（预览模式，刷新后会清空）');
    if (persisted) {
      try {
        const result = navigator.storage && typeof navigator.storage.persist === 'function'
          ? navigator.storage.persist()
          : null;
        if (result && typeof result.catch === 'function') result.catch(() => {});
      } catch (error) {
        // 某些预览环境会禁止 storage.persist，忽略即可。
      }
    }
  }

  /* ---------------- 路由与页面 ---------------- */

  function parseRoute() {
    const raw = window.location.hash.replace(/^#/, '');
    if (raw === '/record') return { name: 'record' };
    if (raw.startsWith('/detail/')) {
      let id = '';
      try { id = decodeURIComponent(raw.slice('/detail/'.length)); } catch (error) { id = raw.slice('/detail/'.length); }
      return { name: 'detail', id };
    }
    return { name: 'home' };
  }

  function setPage(name) {
    const pages = {
      home: ui.pageHome,
      record: ui.pageRecord,
      detail: ui.pageDetail
    };
    Object.entries(pages).forEach(([key, page]) => {
      if (!page) return;
      page.hidden = key !== name;
      if (key === name) {
        page.classList.remove('is-entering');
        void page.offsetWidth;
        page.classList.add('is-entering');
      }
    });
  }

  function scrollHomeSoon() {
    const pendingDay = state.pendingScrollDay;
    if (pendingDay) {
      state.pendingScrollDay = null;
      window.setTimeout(() => {
        const day = document.querySelector(`[data-day="${pendingDay}"]`);
        if (day) {
          const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          day.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
        }
      }, 120);
      return;
    }
    if (state.homeScroll > 0) {
      const target = state.homeScroll;
      requestAnimationFrame(() => window.scrollTo(0, target));
    } else {
      window.scrollTo(0, 0);
    }
  }

  function handleRoute() {
    if (!state.ready) return;
    const next = parseRoute();
    const previous = state.route;
    if (ui.leaveDialog && !ui.leaveDialog.hidden) {
      ui.leaveDialog.hidden = true;
      if (ui.appShell) ui.appShell.removeAttribute('inert');
      document.body.classList.remove('is-locked');
      state.dialogReturnFocus = null;
    }
    if (previous.name === 'home' && next.name !== 'home') {
      state.homeScroll = window.scrollY;
    }
    if (previous.name === 'record' && next.name !== 'record') {
      teardownRecordPage();
    }
    if (next.name !== 'record') {
      stopActiveAudio();
    }

    if (next.name === 'home') {
      state.route = next;
      renderHome();
      setPage('home');
      document.title = '拾色 · 色谱';
      scrollHomeSoon();
      return;
    }

    if (next.name === 'record') {
      state.route = next;
      setupRecordPage();
      setPage('record');
      document.title = '拾色 · 记录';
      window.scrollTo(0, 0);
      return;
    }

    const record = state.records.find((item) => item.id === next.id);
    if (!record) {
      showToast('这一页颜色已经不在了');
      replaceRoute('/');
      return;
    }
    state.route = next;
    renderDurableRecord(record);
    setPage('detail');
    document.title = '拾色 · 一页颜色';
    window.scrollTo(0, 0);
  }

  function replaceRoute(hash) {
    const target = `#${hash}`;
    if (window.location.hash === target) {
      handleRoute();
      return;
    }
    try {
      window.history.replaceState(null, '', target);
      handleRoute();
    } catch (error) {
      window.location.hash = hash;
    }
  }

  /* ---------------- 提示与离开确认 ---------------- */

  function showToast(message) {
    if (!ui.toast) return;
    window.clearTimeout(state.toastTimer);
    ui.toast.textContent = message;
    ui.toast.classList.add('is-show');
    state.toastTimer = window.setTimeout(() => {
      ui.toast.classList.remove('is-show');
    }, 2650);
  }

  function openLeaveDialog() {
    if (!ui.leaveDialog) return;
    state.dialogReturnFocus = document.activeElement;
    if (ui.appShell) ui.appShell.setAttribute('inert', '');
    ui.leaveDialog.hidden = false;
    document.body.classList.add('is-locked');
    window.setTimeout(() => {
      if (ui.stayBtn) ui.stayBtn.focus();
    }, 30);
  }

  function closeLeaveDialog() {
    if (!ui.leaveDialog) return;
    ui.leaveDialog.hidden = true;
    if (ui.appShell) ui.appShell.removeAttribute('inert');
    document.body.classList.remove('is-locked');
    const focusTarget = state.dialogReturnFocus;
    state.dialogReturnFocus = null;
    if (focusTarget && typeof focusTarget.focus === 'function') focusTarget.focus();
  }

  function hasDraftContent() {
    if (!state.draft) return false;
    return Boolean(
      state.draft.photoBlob ||
      state.draft.processing ||
      (Array.isArray(state.draft.audioClips) && state.draft.audioClips.length) ||
      (ui.noteInput && ui.noteInput.value.trim())
    );
  }

  function requestLeaveRecord() {
    if (voice.recording || voice.starting) {
      stopVoiceRecording({ discard: true });
    }
    if (hasDraftContent()) openLeaveDialog();
    else replaceRoute('/');
  }

  /* ---------------- 事件绑定与启动 ---------------- */

  function bindEvents() {
    ui.openRecord.addEventListener('click', () => {
      state.pendingScrollDay = null;
      if (window.location.hash === '#/record') handleRoute();
      else window.location.hash = '/record';
    });

    ui.recordBack.addEventListener('click', requestLeaveRecord);
    ui.detailBack.addEventListener('click', () => replaceRoute('/'));

    ui.shootBtn.addEventListener('click', () => openPhotoPicker(ui.cameraInput));
    ui.albumBtn.addEventListener('click', () => openPhotoPicker(ui.albumInput));
    ui.retakeBtn.addEventListener('click', () => openPhotoPicker(ui.cameraInput));
    ui.replaceBtn.addEventListener('click', () => openPhotoPicker(ui.albumInput));

    ui.cameraInput.addEventListener('change', () => {
      const file = ui.cameraInput.files && ui.cameraInput.files[0];
      ui.cameraInput.value = '';
      handlePhotoFile(file);
    });
    ui.albumInput.addEventListener('change', () => {
      const file = ui.albumInput.files && ui.albumInput.files[0];
      ui.albumInput.value = '';
      handlePhotoFile(file);
    });

    ui.draftPhoto.addEventListener('load', () => ui.draftPhoto.classList.add('is-loaded'));
    ui.noteInput.addEventListener('input', () => {
      ui.noteCount.textContent = `${ui.noteInput.value.length} / ${MAX_NOTE}`;
    });

    ui.holdVoice.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      try { ui.holdVoice.setPointerCapture(event.pointerId); } catch (error) { /* noop */ }
      beginVoiceRecording();
    });
    ui.holdVoice.addEventListener('contextmenu', (event) => event.preventDefault());
    ui.holdVoice.addEventListener('keydown', (event) => {
      if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) {
        event.preventDefault();
        beginVoiceRecording();
      }
    });
    ui.holdVoice.addEventListener('keyup', (event) => {
      if (event.key === ' ' || event.key === 'Enter') {
        event.preventDefault();
        if (voice.recording || voice.starting) stopVoiceRecording();
      }
    });
    window.addEventListener('pointerup', () => {
      if (voice.holding || voice.recording || voice.starting) stopVoiceRecording();
    });
    window.addEventListener('pointercancel', () => {
      if (voice.holding || voice.recording || voice.starting) stopVoiceRecording();
    });
    window.addEventListener('blur', () => {
      if (voice.recording) stopVoiceRecording();
      else if (voice.starting) abandonPendingVoiceStart();
    });

    ui.recordForm.addEventListener('submit', handleSave);

    ui.stayBtn.addEventListener('click', closeLeaveDialog);
    ui.leaveBtn.addEventListener('click', () => {
      closeLeaveDialog();
      replaceRoute('/');
    });
    ui.dialogBackdrop.addEventListener('click', closeLeaveDialog);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !ui.leaveDialog.hidden) {
        event.preventDefault();
        closeLeaveDialog();
      }
    });

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('pagehide', () => {
      if (state.activeAudio) stopActiveAudio();
      if (voice.recording || voice.starting) stopVoiceRecording({ discard: true });
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        if (state.activeAudio) stopActiveAudio();
        if (voice.recording) stopVoiceRecording();
        else if (voice.starting) abandonPendingVoiceStart();
      }
    });
  }

  async function boot() {
    Object.assign(ui, {
      appShell: $('#app'),
      pageHome: $('#page-home'),
      pageRecord: $('#page-record'),
      pageDetail: $('#page-detail'),
      timeline: $('#timeline'),
      heroMonth: $('#heroMonth'),
      heroMeta: $('#heroMeta'),
      monthFog: $('#monthFog'),
      openRecord: $('#openRecord'),
      recordBack: $('#recordBack'),
      detailBack: $('#detailBack'),
      recordForm: $('#recordForm'),
      photoEmpty: $('#photoEmpty'),
      photoView: $('#photoView'),
      draftPhoto: $('#draftPhoto'),
      extracting: $('#extracting'),
      photoSwap: $('#photoSwap'),
      shootBtn: $('#shootBtn'),
      albumBtn: $('#albumBtn'),
      retakeBtn: $('#retakeBtn'),
      replaceBtn: $('#replaceBtn'),
      cameraInput: $('#cameraInput'),
      albumInput: $('#albumInput'),
      palettePreview: $('#palettePreview'),
      paletteStrip: $('#paletteStrip'),
      noteInput: $('#noteInput'),
      noteCount: $('#noteCount'),
      holdVoice: $('#holdVoice'),
      holdLabel: $('#holdLabel'),
      voiceState: $('#voiceState'),
      voiceTimer: $('#voiceTimer'),
      voiceWave: $('#voiceWave'),
      voiceHint: $('.voice-hint'),
      voiceUnsupported: $('#voiceUnsupported'),
      draftAudio: $('#draftAudio'),
      recordPrivacy: $('.record-privacy'),
      saveBtn: $('#saveBtn'),
      saveText: $('#saveText'),
      saveHint: $('#saveHint'),
      detailContent: $('#detailContent'),
      toast: $('#toast'),
      leaveDialog: $('#leaveDialog'),
      dialogBackdrop: $('#dialogBackdrop'),
      stayBtn: $('#stayBtn'),
      leaveBtn: $('#leaveBtn')
    });
    bindEvents();
    detectVoiceSupport();
    try {
      state.db = await openDatabase();
      state.records = await loadRecords();
      state.storageMode = 'indexeddb';
    } catch (error) {
      // 预览环境、无痕模式或受限 iframe 可能禁止数据库。
      // 不阻断页面，改用内存记录，本次页面关闭后自动清空。
      state.storageMode = 'memory';
      state.db = null;
      state.records = [];
      console.warn('拾色：持久存储不可用，已切换到内存预览模式。', error);
    }
    state.ready = true;
    handleRoute();
    if (state.storageMode === 'indexeddb') {
      window.setTimeout(() => {
        migrateLegacyPalettes().catch((error) => console.error('拾色：旧记录迁移失败', error));
      }, 420);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
